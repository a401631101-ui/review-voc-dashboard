 {name:'地漏',volume:2213,unique:1952,risk:31.3,dup:10.9,themes:[['质量做工',946,48.5],['颜色外观',565,28.9],['效果性能',251,12.9],['安装施工',231,11.8]],job:'用户购买的核心不是“一个金属件”，而是同时解决快速排水、隔绝返味、拦截毛发和适配洗衣机排水。',positive:'厚重用料、边缘无毛刺、隐形外观、开合顺畅和安装尺寸标准最容易建立品质信任。',pains:['排水速度与防臭芯阻力发生冲突，拿掉芯能排水但会返味。','表面蜕皮、掉色、磕碰等问题直接破坏“高价大品牌”的预期。','客服对三通、负压和安装适配解释不清，放大产品问题。'],scenes:'卫生间淋浴、阳台洗衣机、老房返味治理；使用后评价比开箱评价更关键。',action:'按地漏芯类型建立“流量—防臭—管径”适配表；详情页给出排水量、安装深度和错误安装示例；售后增加视频诊断。',quote:'“地漏芯洗澡水排不出去，溢出来；客服让拿掉芯，拿出来不就反味了。”',quoteMeta:'产品性能 + 安装指导'},
 {name:'艺术漆',volume:1694,unique:1560,risk:23.3,dup:6.9,themes:[['效果性能',522,33.5],['颜色外观',386,24.7],['气味环保',294,18.8],['安装施工',199,12.8]],job:'主要任务是低成本完成瓷砖、卫生间或旧墙改色，让普通用户也能DIY出“翻新前后明显”的效果。',positive:'覆盖力、颜色高级、低气味、工具齐全、薄刷操作简单，是评论中最具传播力的组合。',pains:['实际颜色与展示图不一致，二次补购还可能出现批次色差。','起皮、翘壳、变色常与基层处理、干燥时间和罩面步骤混杂。','“新手可操作”与实际施工复杂度之间存在落差。'],scenes:'老旧卫生间翻新、瓷砖改色、租住空间轻改造和DIY小花砖。',action:'把基层材质、处理剂、薄刷次数、间隔时间和罩面要求做成场景化施工卡；提供实体色板与批次管理说明。',quote:'“图片依次是原来的地面、一遍、两遍和DIY小花……客服因运输问题很快解决，也适合新手操作。”',quoteMeta:'DIY场景 + 服务补救'},
 {name:'水槽套餐',volume:1900,unique:1836,risk:9.6,dup:3.1,themes:[['质量做工',892,48.6],['颜色外观',667,36.3],['安装施工',404,22.0],['客服售后',322,17.5]],job:'用户需要的不只是水槽，而是一套能与台面、净水器、洗碗机和水龙头协同安装的厨房工作站。',positive:'304不锈钢、盆体深度、抗指纹、抽拉龙头、集渣篮和配件齐全共同形成“一站式配齐”的价值。',pains:['左右开孔、净水器孔和实物不一致，往往安装后才发现，返工成本高。','套餐配件多，少件、错件或接口不适配会阻断安装。','开箱未验货与跨城市装修使责任认定更复杂。'],scenes:'新房整装、旧水槽替换、净水器/洗碗机联动安装；安装师傅是重要影响者。',action:'下单前用结构化问答确认台面尺寸、开孔方向和设备接口；包装内放置配件清单；安装前强制开箱核对。',quote:'“第一句话就说明净水器孔要在左边，客服推荐后实物却只有右边一个孔，安装后才发现。”',quoteMeta:'配置错误 + 高返工成本'},
 {name:'内墙乳胶漆',volume:1785,unique:1691,risk:11.3,dup:4.7,themes:[['气味环保',618,36.5],['客服售后',422,25.0],['颜色外观',371,21.9],['效果性能',307,18.2]],job:'用户希望在颜色翻新的同时降低气味和入住等待，并获得用量测算、上门施工或完整刷新服务。',positive:'低气味、颜色准确、遮盖和耐擦洗是产品认可点；专业师傅、进度透明和无增项则是服务认可点。',pains:['“8小时入住”与热线解释不一致，环保承诺容易演变为信任危机。','色卡、屏幕展示和上墙干燥后的颜色存在认知差异。','墙体原有发霉、开裂与产品施工效果常被混在同一条评论中。'],scenes:'儿童房/老人房刷新、旧墙修复、整屋服务和局部补漆。',action:'统一入住时间口径并说明检测条件；把旧墙诊断与漆本身效果分开；提供小样试刷和分墙体用量计算。',quote:'“买之前说8小时能入住，热线又说7天后才能入住，有明显误导。”',quoteMeta:'环保承诺 + 服务一致性'},

function drawCategoryCharts(c,s){drawRadar(c);drawPurposes(s);drawKeywords(s)}
function drawRadar(c){const o=prepCanvas('themeRadar');if(!o)return;const{x,w,h}=o,cx=w/2,cy=h/2+8,R=Math.min(w*.30,h*.36),n=c.themes.length,max=50;x.clearRect(0,0,w,h);x.lineWidth=1;for(let ring=1;ring<=4;ring++){x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI*2/n,r=R*ring/4,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.strokeStyle='rgba(255,255,255,.18)';x.stroke()}for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI*2/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.strokeStyle='rgba(255,255,255,.16)';x.stroke();const lx=cx+Math.cos(a)*(R+24),ly=cy+Math.sin(a)*(R+18);x.fillStyle='rgba(255,255,255,.86)';x.font='12px system-ui';x.textAlign=Math.cos(a)>.25?'left':Math.cos(a)<-.25?'right':'center';x.textBaseline=Math.sin(a)>.4?'top':Math.sin(a)<-.4?'bottom':'middle';x.fillText(c.themes[i][0],lx,ly)}x.beginPath();c.themes.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/n,r=R*Math.min(v[2],max)/max,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();const g=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,'rgba(61,178,255,.72)');g.addColorStop(1,'rgba(139,92,246,.58)');x.fillStyle=g;x.fill();x.strokeStyle='#8fd4ff';x.lineWidth=2;x.stroke();c.themes.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/n,r=R*Math.min(v[2],max)/max,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.beginPath();x.arc(px,py,4,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.fillStyle='#fff';x.font='600 11px system-ui';x.textAlign='center';x.fillText(v[2]+'%',px,py-9)})}
function drawPurposes(s){const o=prepCanvas('purposeBars');if(!o)return;const{x,w,h}=o,data=s.purposes.slice(0,6),max=50,left=92,right=42,top=12,row=(h-24)/data.length,colors=['#3478f6','#12a67a','#f59e0b','#8b5cf6','#ef5b5b','#27ae60'];x.clearRect(0,0,w,h);data.forEach((v,i)=>{const y=top+i*row+row*.22,bw=(w-left-right)*Math.min(v[2],max)/max;x.fillStyle='rgba(120,110,160,.12)';x.fillRect(left,y,w-left-right,row*.42);x.fillStyle=colors[i];x.fillRect(left,y,bw,row*.42);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17202a';x.font='12px system-ui';x.textAlign='right';x.textBaseline='middle';x.fillText(v[0],left-8,y+row*.21);x.textAlign='left';x.fillText(v[2]+'%',Math.min(left+bw+6,w-right+3),y+row*.21)})}
function drawKeywords(s){const o=prepCanvas('keywordBars');if(!o)return;const{x,w,h}=o,data=s.keywords.slice(0,8),max=Math.max(...data.map(v=>v[2])),left=70,right=46,top=10,row=(h-20)/data.length,colors=['#3478f6','#12a67a','#f59e0b','#8b5cf6'];x.clearRect(0,0,w,h);data.forEach((v,i)=>{const y=top+i*row+row*.22,bw=(w-left-right)*v[2]/max;x.fillStyle='rgba(130,145,165,.13)';x.fillRect(left,y,w-left-right,row*.46);const g=x.createLinearGradient(left,0,left+bw,0);g.addColorStop(0,colors[i%4]);g.addColorStop(1,colors[(i+1)%4]);x.fillStyle=g;x.fillRect(left,y,bw,row*.46);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17202a';x.font='12px system-ui';x.textAlign='right';x.textBaseline='middle';x.fillText(v[0],left-9,y+row*.23);x.textAlign='left';x.fillText(v[2]+'%',Math.min(left+bw+6,w-right+4),y+row*.23)})}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const c=categories[selectedCategory];drawCategoryCharts(displayCategory(c),categorySignals[c.name])},120)});
renderCategoryList();renderCategoryDetail();
document.getElementById('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark',c=categories[selectedCategory];document.documentElement.dataset.theme=dark?'light':'dark';document.getElementById('themeBtn').textContent=dark?'深色模式':'浅色模式';requestAnimationFrame(()=>drawCategoryCharts(displayCategory(c),categorySignals[c.name]))});
</script>
</body>
</html>
