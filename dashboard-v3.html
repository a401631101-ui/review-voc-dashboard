  <section class="keyword-story"><div class="keyword-chart-wrap"><h2><span class="icon">#</span>关键词影响力</h2><p>当前筛选去重评论提及率 Top 8</p><canvas id="keywordBars" role="img" aria-label="${c.name}关键词横向条形图">${signalData.keywords.map(v=>v[0]+' '+v[2]+'%').join('；')}</canvas></div><div class="keyword-copy"><h2>价值判断词</h2><p>点击导航后同步更新，不把关键词直接等同于情感结论</p><div class="keyword-cloud">${signalData.keywords.map(k=>`<span class="keyword-pill">${esc(k[0])}<small>${fmt(k[1])} · ${k[2]}%</small></span>`).join('')}</div></div></section>
  <div class="analysis-triad"><div class="card co-card"><h2 class="section-title"><span class="icon">↔</span>问题共现</h2><p class="section-sub">同一条评论同时命中两个主题</p>${co.length?co.map(x=>`<div class="signal-row"><span><b>${esc(x[0])}</b></span><span>${fmt(x[1])}条 · ${x[2]}%</span></div>`).join(''):'<div class="empty-evidence">当前筛选暂无明显共现链路</div>'}</div>
  <div class="card evolution-card"><h2 class="section-title"><span class="icon">→</span>内容演化</h2><p class="section-sub">从期待、验证到风险触发</p><div class="finding"><b>期待</b><span class="small">${esc(labels(segment?.purposes))}</span></div><div class="finding"><b>验证</b><span class="small">围绕${esc(labels(segment?.keywords))}判断价值</span></div><div class="finding"><b>风险</b><span class="small">${esc(labels(negTerms))}</span></div></div>
  <div class="card pain-card"><h2 class="section-title"><span class="icon">!</span>核心痛点</h2><p class="section-sub">当前筛选中的风险表达词，不代表因果</p>${negTerms.length?negTerms.map((x,i)=>`<div class="finding"><b>${i+1}. ${esc(x[0])}</b><span class="small">${fmt(x[1])}条评论出现</span></div>`).join(''):'<div class="empty-evidence">当前筛选未形成集中风险词</div>'}</div></div>
  <div class="card brand-insight"><h2 class="section-title"><span class="icon">★</span>品牌之间对比分析</h2><p class="section-sub">同类目、同月份、同一文本推断口径；少于30条的店铺不参与排名</p><div class="brand-compare-grid"><div class="brand-compare-card"><b>体验领先</b><span>${best?`${esc(best.shop)} · ${best.score}/5 · ${fmt(best.n)}条`:'可比样本不足'}</span></div><div class="brand-compare-card"><b>风险控制</b><span>${lowRisk?`${esc(lowRisk.shop)} · 风险${lowRisk.riskRate}%`:'可比样本不足'}</span></div><div class="brand-compare-card"><b>${selectedShop==='全部店铺'?'可比范围':'当前品牌位置'}</b><span>${selectedShop==='全部店铺'?`${eligible.length}家店铺达到比较门槛`:selectedRank?`第${selectedRank}/${eligible.length} · ${segment.score}/5`:'样本不足，不参与排名'}</span></div></div><div class="compare-grid" style="margin-top:12px"><div class="compare-box"><h3>✓ 正向表达集中</h3><p>${esc(labels(posTerms))}</p></div><div class="compare-box highlight"><h3>! 主要风险差异</h3><p>${esc(labels(negTerms))}</p></div></div></div>
  `;bindFilters(c,displayC,signalData,bRows)}
function prepCanvas(id){const el=document.getElementById(id);if(!el)return null;const dpr=Math.min(window.devicePixelRatio||1,2),r=el.getBoundingClientRect();el.width=Math.max(1,Math.round(r.width*dpr));el.height=Math.max(1,Math.round(r.height*dpr));const x=el.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return{el,x,w:r.width,h:r.height}}
function drawCategoryCharts(c,s,bRows){drawRadar(c);drawPurposes(s);drawBrands(bRows);drawKeywords(s)}
function drawRadar(c){const o=prepCanvas('themeRadar');if(!o)return;const{x,w,h}=o,cx=w/2,cy=h/2+8,R=Math.min(w*.30,h*.36),n=c.themes.length,max=50;x.clearRect(0,0,w,h);x.lineWidth=1;for(let ring=1;ring<=4;ring++){x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI*2/n,r=R*ring/4,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.strokeStyle='rgba(255,255,255,.18)';x.stroke()}for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI*2/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.strokeStyle='rgba(255,255,255,.16)';x.stroke();const lx=cx+Math.cos(a)*(R+24),ly=cy+Math.sin(a)*(R+18);x.fillStyle='rgba(255,255,255,.86)';x.font='12px system-ui';x.textAlign=Math.cos(a)>.25?'left':Math.cos(a)<-.25?'right':'center';x.textBaseline=Math.sin(a)>.4?'top':Math.sin(a)<-.4?'bottom':'middle';x.fillText(c.themes[i][0],lx,ly)}x.beginPath();c.themes.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/n,r=R*Math.min(v[2],max)/max,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();const g=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,'rgba(61,178,255,.72)');g.addColorStop(1,'rgba(139,92,246,.58)');x.fillStyle=g;x.fill();x.strokeStyle='#8fd4ff';x.lineWidth=2;x.stroke();c.themes.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/n,r=R*Math.min(v[2],max)/max,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.beginPath();x.arc(px,py,4,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.fillStyle='#fff';x.font='600 11px system-ui';x.textAlign='center';x.fillText(v[2]+'%',px,py-9)})}
function drawPurposes(s){const o=prepCanvas('purposeBars');if(!o)return;const{x,w,h}=o,data=s.purposes.slice(0,6),max=50,left=92,right=42,top=12,row=(h-24)/data.length,colors=['#3478f6','#12a67a','#f59e0b','#8b5cf6','#ef5b5b','#27ae60'];x.clearRect(0,0,w,h);data.forEach((v,i)=>{const y=top+i*row+row*.22,bw=(w-left-right)*Math.min(v[2],max)/max;x.fillStyle='rgba(120,110,160,.12)';x.fillRect(left,y,w-left-right,row*.42);x.fillStyle=colors[i];x.fillRect(left,y,bw,row*.42);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17202a';x.font='12px system-ui';x.textAlign='right';x.textBaseline='middle';x.fillText(v[0],left-8,y+row*.21);x.textAlign='left';x.fillText(v[2]+'%',Math.min(left+bw+6,w-right+3),y+row*.21)})}
function drawBrands(rows){const o=prepCanvas('brandBars');if(!o)return;const{x,w,h}=o,data=rows.filter(v=>v.n>=30).slice(0,7),left=Math.min(116,w*.42),right=38,top=8,row=(h-16)/Math.max(data.length,1);x.clearRect(0,0,w,h);if(!data.length){x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()||'#667085';x.font='13px system-ui';x.textAlign='center';x.fillText('当前月份可比样本不足',w/2,h/2);return}data.forEach((v,i)=>{const y=top+i*row+row*.22,bw=(w-left-right)*v.score/5,active=v.shop===selectedShop;x.fillStyle='rgba(14,147,132,.12)';x.fillRect(left,y,w-left-right,row*.44);const g=x.createLinearGradient(left,0,left+bw,0);g.addColorStop(0,active?'#6941c6':'#0e9384');g.addColorStop(1,active?'#9b7cff':'#36c6a8');x.fillStyle=g;x.fillRect(left,y,bw,row*.44);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17202a';x.font=active?'700 11px system-ui':'11px system-ui';x.textAlign='right';x.textBaseline='middle';const name=v.shop.length>9?v.shop.slice(0,8)+'…':v.shop;x.fillText(name,left-7,y+row*.22);x.textAlign='left';x.fillText(v.score.toFixed(1),Math.min(left+bw+5,w-right+3),y+row*.22)})}
function drawKeywords(s){const o=prepCanvas('keywordBars');if(!o)return;const{x,w,h}=o,data=s.keywords.slice(0,8),max=Math.max(1,...data.map(v=>v[2])),left=70,right=46,top=10,row=(h-20)/data.length,colors=['#3478f6','#12a67a','#f59e0b','#8b5cf6'];x.clearRect(0,0,w,h);data.forEach((v,i)=>{const y=top+i*row+row*.22,bw=(w-left-right)*v[2]/max;x.fillStyle='rgba(130,145,165,.13)';x.fillRect(left,y,w-left-right,row*.46);const g=x.createLinearGradient(left,0,left+bw,0);g.addColorStop(0,colors[i%4]);g.addColorStop(1,colors[(i+1)%4]);x.fillStyle=g;x.fillRect(left,y,bw,row*.46);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17202a';x.font='12px system-ui';x.textAlign='right';x.textBaseline='middle';x.fillText(v[0],left-9,y+row*.23);x.textAlign='left';x.fillText(v[2]+'%',Math.min(left+bw+6,w-right+4),y+row*.23)})}
function currentChartData(){const c=categories[selectedCategory],segment=getSegment(c);return{c,displayC:displayCategory(c),signals:{purposes:segment?.purposes?.length?segment.purposes:[['暂无明确目的',0,0]],keywords:segment?.keywords?.length?segment.keywords:[['暂无明确关键词',0,0]]},brands:brandRows(c)}}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const d=currentChartData();drawCategoryCharts(d.displayC,d.signals,d.brands)},120)});
renderCategoryList();renderCategoryDetail();
document.getElementById('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';document.getElementById('themeBtn').textContent=dark?'深色模式':'浅色模式';requestAnimationFrame(()=>{const d=currentChartData();drawCategoryCharts(d.displayC,d.signals,d.brands)})});
</script>
</body>
